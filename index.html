<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movad</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:system-ui,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;text-align:center}
    h1{font-size:4rem;margin:0;letter-spacing:4px;font-weight:800}
    h1 span{display:inline-block;
      background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;
      animation:bounce 4s cubic-bezier(.28,.84,.42,1) infinite}
    h1 span:nth-child(1){animation-delay:0s}
    h1 span:nth-child(2){animation-delay:.15s}
    h1 span:nth-child(3){animation-delay:.3s}
    h1 span:nth-child(4){animation-delay:.45s}
    h1 span:nth-child(5){animation-delay:.6s}
    @keyframes bounce{
      0%{transform:translateY(0) scaleY(1)}
      6%{transform:translateY(-40px) scaleY(1.1)}
      12%{transform:translateY(0) scaleY(.85)}
      17%{transform:translateY(-15px) scaleY(1.03)}
      22%{transform:translateY(0) scaleY(.97)}
      26%,100%{transform:translateY(0) scaleY(1)}
    }
    p{font-size:1.1rem;opacity:.85;margin:16px 0 28px}
    a{display:inline-block;padding:12px 28px;border-radius:999px;background:#fff;color:#1e3a8a;
      text-decoration:none;font-weight:600}
    @media (prefers-reduced-motion:reduce){h1 span{animation:none}}
  </style>
</head>
<body>
  <main>
    <h1 aria-label="Movad"><span>M</span><span>o</span><span>v</span><span>a</span><span>d</span></h1>
    <p>Need help or have feedback? We're happy to hear from you.</p>
    <a href="mailto:movadmob@gmail.com">Contact Support</a>
  </main>
</body>
</html>
